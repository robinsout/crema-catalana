  <g clip-path="url(#tile)">
    <rect width="64" height="64" fill="#1D4F9A"/>
    <g fill="#F3F5F2">
      <circle cx="0" cy="0" r="15"/>
      <circle cx="64" cy="0" r="15"/>
      <circle cx="0" cy="64" r="15"/>
      <circle cx="64" cy="64" r="15"/>
      <circle cx="32" cy="21" r="9"/>
      <circle cx="32" cy="43" r="9"/>
      <circle cx="21" cy="32" r="9"/>
      <circle cx="43" cy="32" r="9"/>
    </g>
    <circle cx="32" cy="32" r="5" fill="#E9AE1C"/>
  </g>
</svg>
