name: CI and deploy

on:
  # documentation does not reach the site: no checks, no deploy (same list as isDocsOnly in scripts/lib/session.ts)
  push:
    branches: [master]
    paths-ignore: ['**.md', '.claude/**', 'LICENSE', 'LICENSE-CONTENT']
  pull_request:
    paths-ignore: ['**.md', '.claude/**', 'LICENSE', 'LICENSE-CONTENT']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run check   # types + tests + build
      - run: npx playwright install --with-deps chromium webkit
      - run: npm run e2e     # functional browser tests; screenshot tests are local only
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: playwright-traces
          path: test-results/
          retention-days: 7

  deploy:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    environment:
      name: production
      url: https://crema-catalana.makeitforfun.es/
    concurrency:
      group: deploy
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build   # production defaults for the sync server and the counter stay as in the repo
      # The key is limited to rsync into the site folder (rrsync), so the remote path is "/".
      - name: Upload to the server
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          rsync -rlt --delete --delay-updates dist/ catala-deploy@188.245.182.47:/
