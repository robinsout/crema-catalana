name: Sync server monitor

# Daily check of the sync server: it answers, and its HTTPS certificate (Let's Encrypt for the bare IP,
# ~6 days, renewed by Caddy) has at least 3 days left. A failed run sends the usual GitHub e-mail.
on:
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Health
        run: curl -fsS --max-time 20 -H 'Origin: https://robinsout.github.io' https://188.245.182.47/v1/health
      - name: Certificate has at least 3 days left
        run: |
          end=$(echo | openssl s_client -connect 188.245.182.47:443 2>/dev/null | openssl x509 -noout -enddate | cut -d= -f2)
          left=$(( ( $(date -d "$end" +%s) - $(date +%s) ) / 86400 ))
          echo "certificate valid until $end ($left days left)"
          test "$left" -ge 3
